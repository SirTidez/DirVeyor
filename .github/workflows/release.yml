name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate tag format
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Release requires a stable version tag such as v0.1.0.'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - name: Check package version against tag
        run: |
          $metadataText = & cargo metadata --no-deps --locked --format-version 1
          if ($LASTEXITCODE -ne 0) { throw 'Could not read package metadata.' }
          $metadata = $metadataText | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'dirveyor').version
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match package version $version."
          }
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Installer tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/installer.tests.ps1
      - name: Installer tests (PowerShell 7)
        run: ./tests/installer.tests.ps1
      - name: Package Windows x64
        run: ./scripts/package-windows.ps1
      - name: Verify packaged installation
        shell: powershell
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          ./tests/installer.tests.ps1 -PackagePath "dist/dirveyor-$version-windows-x86_64.zip"
      - name: Save review artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dirveyor-${{ inputs.tag || github.ref_name }}-windows-x86_64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $package = "dist/dirveyor-$version-windows-x86_64.zip"
          # Creation fails if a release already exists; never overwrite published assets.
          & gh release create $env:RELEASE_TAG $package "$package.sha256" --verify-tag --draft --title "DirVeyor $version" --generate-notes
          if ($LASTEXITCODE -ne 0) {
            throw 'Release creation failed. Inspect any existing release before retrying; existing assets are never overwritten.'
          }
