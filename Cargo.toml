[workspace]
members = [
    "crates/fileadmin-app",
    "crates/fileadmin-domain",
    "crates/fileadmin-engine",
    "crates/fileadmin-fs",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/SirTidez/FileAdmin"

[workspace.dependencies]
crossterm = "0.29.0"
crossbeam-channel = "0.5.17"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "crossterm_0_29"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["local-offset"] }
trash = { version = "5.2.7", default-features = false, features = ["coinit_multithreaded"] }
unicode-width = "0.2.2"
windows-sys = "0.61.2"
