[workspace]
members = [
    "crates/fileadmin-app",
    "crates/fileadmin-domain",
    "crates/fileadmin-fs",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/SirTidez/FileAdmin"

[workspace.dependencies]
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "crossterm_0_29"] }
tempfile = "3.27.0"
unicode-width = "0.2.2"

